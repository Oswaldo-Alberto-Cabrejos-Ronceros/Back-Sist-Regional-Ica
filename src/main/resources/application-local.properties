# Nombre de la aplicación
spring.application.name=clinica

# Conexión a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dbclinica-dev
spring.datasource.username=admin_cregional
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad JWT
jwt.secret=41loj[n3K'qUMTIp4n.F==9m{cg%-zB+Va@!C)R18muZ

# Springdoc Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# Logging limpio
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Tiempos de expiración del JWT
jwt.expiration=3600000
jwt.refresh=432000000

#para amazon web service s3
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME}
aws.s3.bucket.nama.public=${AWS_S3_BUCKET_NAME_PUBLIC}
aws.s3.region=${AWS_S3_REGION}

